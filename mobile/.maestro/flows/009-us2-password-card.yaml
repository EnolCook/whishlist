# 009 US2 : la carte « Modifier le mot de passe » s'ouvre repliée, se déplie par son en-tête, reste ouverte
# avec la carte Profil, puis se replie. L'envoi du formulaire se vérifie à la main (exclusions.md) ;
# le message dans la carte ouverte est couvert par __tests__/screens/account.test.tsx.
appId: app.ohyoushouldnt.mobile
name: "009 US2 — Déplier la carte Mot de passe"
tags:
  - 009-us2
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: alex@example.test
- tapOn:
    id: open-account
- extendedWaitUntil:
    visible:
      id: account.password-toggle
    timeout: 10000
- assertNotVisible:
    id: account.password-current

# Dépliée : les trois champs et le bouton apparaissent.
- tapOn:
    id: account.password-toggle
- assertVisible:
    id: account.password-current
- assertVisible:
    id: account.password-next
- assertVisible:
    id: account.password-confirm

# Les deux cartes peuvent être ouvertes ensemble.
- tapOn:
    id: account.profile-toggle
- assertVisible:
    id: account.name
- scrollUntilVisible:
    element:
      id: account.password-submit

# Repliée de nouveau, la carte Profil reste ouverte.
- scrollUntilVisible:
    element:
      id: account.password-toggle
    direction: UP
- tapOn:
    id: account.password-toggle
- assertNotVisible:
    id: account.password-current
- scrollUntilVisible:
    element:
      id: account.name
    direction: UP
