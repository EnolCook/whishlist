# 005 US2 : mes listes (Alex voit la liste de démo) ; avec un compte neuf, nouvelle liste ouverte puis présente
# dans « Mes listes » ; une liste créée sans rien remplir prend les valeurs par défaut du site (nom d'après le
# nom du compte). Voir specs/005-mobile-list-app/spec.md.
appId: app.ohyoushouldnt.mobile
name: "005 US2 — Voir ses listes et en créer une"
tags:
  - 005-us2
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
- runScript: ../scripts/unique.js
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: alex@example.test
- assertVisible:
    id: lists.card-demo-list
- runFlow: ../subflows/logout.yaml

# Compte neuf, pour que les listes comptées ne dépendent d'aucun autre parcours.
- runFlow: ../subflows/register.yaml
- assertVisible:
    id: lists.empty

# Nouvelle liste : elle s'ouvre, puis apparaît dans « Mes listes ».
- runFlow:
    file: ../subflows/create-list.yaml
    env:
      TITLE: Noël ${output.unique}
- assertVisible: Noël ${output.unique}
- tapOn:
    id: back-link.back
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 10000
- scrollUntilVisible:
    element:
      text: Noël ${output.unique}

# Rien de rempli : comme sur le site, chaque champ prend sa valeur par défaut et la liste s'ouvre.
- tapOn:
    id: lists.new
- extendedWaitUntil:
    visible:
      id: new-list.screen
    timeout: 10000
- runFlow: ../subflows/submit-new-list.yaml
- extendedWaitUntil:
    visible:
      id: list.screen
    timeout: 20000
# Nom par défaut d'après le nom du compte (« E2E <unique> », register.yaml), en français ou en anglais :
# un texte à variable, absent de output.t, donc vérifié par motif.
- assertVisible: "(Liste de E2E ${output.unique}|E2E ${output.unique}’s list)"
- tapOn:
    id: back-link.back
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 10000
# Deux listes : « Noël » et la liste par défaut.
- assertVisible:
    id: lists\.card-.*(?<!-shadow)
    index: 1
- assertNotVisible:
    id: lists\.card-.*(?<!-shadow)
    index: 2
