# Nouveau compte e2e-<unique>@example.test (R6), mot de passe DEMO_PASSWORD, depuis l'écran de connexion,
# sans confirmer son adresse (010). Rend l'adresse dans output.email ; attend « Mes listes ».
appId: app.ohyoushouldnt.mobile
---
# Avant de créer un compte : preuve que l'app parle au serveur local de la suite (voir login.yaml).
- runFlow:
    file: login.yaml
    env:
      EMAIL: alex@example.test
- runFlow: logout.yaml
- runScript: ../scripts/unique.js
- evalScript: ${output.email = 'e2e-' + output.unique + '@example.test'}
- runFlow:
    file: submit-register.yaml
    env:
      NAME: E2E ${output.unique}
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 20000
