# Nouveau compte e2e-<unique>@example.test (R6), mot de passe DEMO_PASSWORD, depuis l'écran de connexion,
# adresse confirmée par le lien reçu dans MailDev (010). Rend l'adresse dans output.email ; attend « Mes listes ».
appId: app.ohyoushouldnt.mobile
---
# Textes attendus (output.t) : certains parcours appelants ne les chargent pas eux-mêmes.
- runScript: ../scripts/strings.generated.js
- runFlow: register-unconfirmed.yaml
- runFlow:
    file: confirm-email.yaml
    env:
      TO: ${output.email}
      DONE: ${output.t.auth.confirmEmail.verified}
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: verify.banner
    timeout: 10000
